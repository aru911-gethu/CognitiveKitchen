name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      # The suite is offline by design: no Neo4j, no API keys, no network.
      # A placeholder .env only satisfies config loading.
      - name: Placeholder .env
        run: cp .env.example .env

      - name: Run tests
        run: uv run pytest tests -q --no-header
