[project]
name = "cognitive-kitchen"
version = "0.1.0"
description = "Modular, production-grade RAG recipe assistant"
readme = "README.md"
authors = [
    { name = "Narun" }
]
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.0",
    "langsmith>=0.12.1",
    "pandas>=3.0.5",
    "playwright>=1.62.0",
    "pydantic>=2.13.5",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false
